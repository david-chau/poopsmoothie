# Production compose for the NAS — pulls the prebuilt multi-arch image from
# GHCR instead of building from source (see scripts/publish.sh).
#
#   PS_IMAGE=ghcr.io/<your-gh-user>/poopsmoothie:latest \
#     docker compose -f docker-compose.prod.yml up -d
#
# (or edit the default below and just `docker compose -f docker-compose.prod.yml up -d`)
services:
  poopsmoothie:
    image: ${PS_IMAGE:-ghcr.io/david-chau/poopsmoothie:latest}
    container_name: poopsmoothie
    ports:
      - "4321:4321"
      - "4322:4322" # https — needed for mic capture (getUserMedia requires a secure context)
    volumes:
      - ./data:/data
      - ./models:/app/models:ro # ./scripts/fetch-models.sh populates this; empty is fine (voice chat just stays off)
    restart: unless-stopped
    environment:
      # unset by default (falls back to server/index.js's own defaults) — set
      # these on the NAS after running `node scripts/stt-bench.mjs` against
      # this same image, if the defaults don't fit this box's CPU
      - PS_STT_MAX_CONCURRENT=${PS_STT_MAX_CONCURRENT:-}
      - PS_STT_THREADS=${PS_STT_THREADS:-}
      - PS_VOICE_SETTLE_MS=${PS_VOICE_SETTLE_MS:-}
      - PS_VOICE_EMBEDDING_THRESHOLD=${PS_VOICE_EMBEDDING_THRESHOLD:-}
      # how much trailing silence ends an utterance (seconds) — lower is
      # snappier, too low splits a sentence at every breath
      - PS_VAD_MIN_SILENCE=${PS_VAD_MIN_SILENCE:-}
